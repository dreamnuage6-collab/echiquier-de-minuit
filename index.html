<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Échiquier de Minuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#15121d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Jolly+Lodger&family=Special+Elite&display=swap">
<style>
/* Concept : un théâtre de minuit. Fond nuit violette, lune en spirale, pièces rayées os et encre,
   bordure d'échiquier à rayures. Le corbeau Corvin est le maître qui commente. */
:root {
  --night: #15121d;
  --night-2: #1f1a2b;
  --night-3: #2a2338;
  --ink: #0b0910;
  --bone: #ece4d0;
  --bone-dim: #b5ab98;
  --violet: #9a78cf;
  --moss: #8fb37a;
  --blood: #d0566a;
  --ember: #e8a33d;
  --sky: #6aa9e0;
  --sq-light: #d9cfb8;
  --sq-dark: #4d4561;
  --display: 'Jolly Lodger', 'Papyrus', fantasy;
  --body: 'Alegreya', Georgia, 'Times New Roman', serif;
  --mono: 'Special Elite', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--night);
  color: var(--bone);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px dashed var(--ember); outline-offset: 3px; }
b, strong { color: #fff6e0; font-weight: 700; }

/* ---------- décor ---------- */
#decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#decor svg { width: 100%; height: 100%; }
.app { position: relative; z-index: 1; max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 48px; }

/* ---------- typographie ---------- */
.display { font-family: var(--display); font-weight: 400; letter-spacing: .02em; line-height: 1; text-wrap: balance; }
.eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--bone-dim); }
.muted { color: var(--bone-dim); }

/* ---------- boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 18px; border-radius: 4px 14px 5px 12px;
  background: var(--night-3); border: 1.5px solid #4a405e; cursor: pointer;
  font-family: var(--body); font-size: 16px; font-weight: 700; transition: transform .12s, background .12s, border-color .12s;
}
.btn:hover { background: #352c47; border-color: var(--violet); }
.btn:active { transform: translateY(1px) rotate(-.4deg); }
.btn.primary { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.btn.primary:hover { background: #fff7e4; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: default; }
.icon-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; }
.btn svg { width: 20px; height: 20px; flex: none; }

/* ---------- écran d'accueil ---------- */
.hero { display: grid; grid-template-columns: 1fr; gap: 8px; padding-block: 18px 8px; }
.hero h1 { font-size: clamp(54px, 13vw, 104px); margin: 0; color: var(--bone); text-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.5deg); transform-origin: left; }
.hero h1 span { display: block; color: var(--violet); font-size: .62em; transform: translateX(.6em) rotate(1deg); }
.hero p { max-width: 58ch; margin: 6px 0 0; font-size: 18px; }
.hero .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; font-family: var(--mono); font-size: 14px; color: var(--bone-dim); }
.hero .stats b { color: var(--ember); font-family: var(--mono); font-weight: 400; font-size: 18px; }

.tombs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 26px 18px; margin-top: 28px; }
.tomb {
  position: relative; text-align: left; cursor: pointer; border: 2px solid #5b5070;
  background: linear-gradient(180deg, #3a3249, #2a2338 60%); color: var(--bone);
  border-radius: 90px 90px 6px 6px; padding: 40px 18px 18px; min-height: 230px;
  display: flex; flex-direction: column; gap: 6px; transition: transform .2s;
  box-shadow: 0 10px 0 -4px #0b0910, inset 0 0 0 5px rgba(0,0,0,.18);
}
.tomb:nth-child(odd) { transform: rotate(-1.6deg); }
.tomb:nth-child(even) { transform: rotate(1.3deg) translateY(6px); }
.tomb:hover { transform: rotate(0) translateY(-4px); border-color: var(--violet); }
.tomb .num { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 13px; letter-spacing: .2em; color: var(--bone-dim); }
.tomb .ttl { font-family: var(--display); font-size: 36px; line-height: 1; margin-top: 4px; }
.tomb .sub { font-size: 15px; color: var(--bone-dim); }
.tomb .bar { margin-top: 2px; height: 8px; border-radius: 4px; background: #1a1624; overflow: hidden; }
.tomb .bar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--bone) 0 6px, var(--ink) 6px 12px); }
.tomb .prog { margin-top: auto; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; color: var(--bone-dim); }
.tomb .ico { width: 34px; height: 34px; color: var(--violet); }

.side-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }

/* ---------- écran chapitre ---------- */
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 6px; min-height: 52px; }
.topbar .ttl { min-width: 0; flex: 1; }
.topbar .ttl { display: grid; gap: 2px; }
.topbar .ttl .display { font-size: clamp(28px, 6vw, 44px); display: block; line-height: 1.05; }
.topbar .ttl .eyebrow { font-size: 11px; }
.chap-head { padding-block: 8px 4px; }
.chap-head h2 { font-size: clamp(44px, 10vw, 72px); margin: 0; transform: rotate(-1deg); }
.chap-head p { max-width: 60ch; margin: 8px 0 0; }
.path { position: relative; margin-top: 22px; display: grid; gap: 12px; max-width: 640px; }
.path::before { content: ""; position: absolute; left: 31px; top: 20px; bottom: 20px; border-left: 3px dotted #5b5070; }
.lvl {
  position: relative; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer;
  background: transparent; border: 0; padding: 6px 8px 6px 0; border-radius: 10px;
}
.lvl:hover .lvl-name { color: #fff; text-decoration: underline wavy var(--violet) 1px; text-underline-offset: 5px; }
.lvl .node {
  flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  background: var(--night-2); border: 2px solid #5b5070; font-family: var(--display); font-size: 30px; color: var(--bone);
  position: relative; z-index: 1;
}
.lvl.done .node { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.lvl.locked { cursor: default; opacity: .5; }
.lvl.locked .node { border-style: dashed; }
.lvl.current .node { border-color: var(--ember); box-shadow: 0 0 0 5px rgba(232,163,61,.18); }
.lvl .meta { min-width: 0; display: grid; gap: 2px; }
.lvl-name { font-size: 18px; font-weight: 700; }
.lvl-kind { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--bone-dim); }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 18px; height: 18px; }
.star-on { color: var(--ember); } .star-off { color: #4a405e; }

/* ---------- écran niveau ---------- */
.play { display: flex; flex-direction: column; gap: 14px; }
.board-box { order: 1; min-width: 0; } .mentor { order: 2; } .actions { order: 3; } .mini-stats { order: 4; } .tools-box { order: 5; min-width: 0; display: grid; gap: 8px; } .carnet { order: 6; }
.panel { display: contents; }
/* téléphone : échiquier presque bord à bord */
@media (max-width: 899px) {
  .board-box { margin-inline: -10px; }
  .board-box .board-wrap, .board-box .cap-row { width: 100%; max-width: min(100%, calc(100vh - 150px)); justify-self: center; }
}
/* écran large : l'échiquier prend toute la hauteur disponible, le maître à droite */
@media (min-width: 900px) {
  .app:has(.play) { padding-block: 6px 20px; }
  .play { display: grid; grid-template-columns: minmax(0, min(calc(100vh - 128px), 930px)) minmax(320px, 1fr); grid-template-areas: "board tools" "board panel"; grid-template-rows: auto 1fr; gap: 12px 26px; align-items: start; }
  .board-box { grid-area: board; } .tools-box { grid-area: tools; }
  .panel { grid-area: panel; display: grid; gap: 14px; align-content: start; min-width: 0; }
  .topbar:has(+ .play) { min-height: 0; padding-block: 2px 6px; }
  .topbar:has(+ .play) .ttl .display { font-size: clamp(26px, 2.6vw, 36px); }
}
.arrow-help .for-touch { display: none; }
@media (hover: none) { .arrow-help .for-touch { display: inline; } .arrow-help .for-mouse { display: none; } }


.frame {
  position: relative; padding: 9px; border-radius: 6px;
  background: repeating-linear-gradient(-45deg, var(--bone) 0 9px, var(--ink) 9px 18px);
  box-shadow: 0 0 0 2px var(--ink), 0 14px 30px -10px rgba(0,0,0,.7);
}
.frame::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed rgba(255,255,255,.0); border-radius: 4px; pointer-events: none; }
.board { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 0 0 3px var(--ink); }
.squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.sq { position: relative; }
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.sq.last::before { content: ""; position: absolute; inset: 0; background: rgba(240,214,120,.42); }
.sq.sel::before { content: ""; position: absolute; inset: 0; background: rgba(154,120,207,.55); }
.sq.check::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(208,86,106,.95) 0, rgba(208,86,106,.5) 45%, transparent 72%); }
.sq.hintsq::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--moss); background: rgba(143,179,122,.3); animation: pulse 1.2s infinite alternate; }
@keyframes pulse { to { background: rgba(143,179,122,.05); } }
.sq.dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 28%; height: 28%; transform: translate(-50%,-50%); border-radius: 50%; background: rgba(21,18,29,.35); }
.sq.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid rgba(21,18,29,.35); }
.sq.hl-o::before, .sq.hl-g::before, .sq.hl-r::before, .sq.hl-b::before { content: ""; position: absolute; inset: 0; opacity: .7; }
.sq.hl-o::before { background: #d98b2b; } .sq.hl-g::before { background: #5f9f4c; } .sq.hl-r::before { background: #c4434f; } .sq.hl-b::before { background: #3f84c4; }
.coord { position: absolute; font-family: var(--mono); font-size: clamp(9px, 2vw, 12px); line-height: 1; pointer-events: none; z-index: 1; }
.coord.f { right: 4%; bottom: 3%; } .coord.r { left: 4%; top: 4%; }
.sq.l .coord { color: var(--sq-dark); } .sq.d .coord { color: var(--sq-light); }
.pc { position: absolute; inset: 2%; width: 96%; height: 96%; z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(11,9,16,.35)); will-change: transform; }
.pc.w { --pf: #efe6d2; --ps: #0b0910; --pd: #0b0910; }
.pc.b { --pf: #1d1826; --ps: #0b0910; --pd: #7d6f94; filter: drop-shadow(0 0 1.2px rgba(236,228,208,.85)) drop-shadow(0 2px 0 rgba(11,9,16,.35)); }
.pc.ghost { position: fixed; z-index: 50; pointer-events: none; inset: auto; filter: drop-shadow(0 8px 6px rgba(0,0,0,.5)); }
.pc.faded { opacity: .3; }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.promo { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(11,9,16,.6); }
.promo .row { display: flex; gap: 6px; background: var(--night-2); border: 2px solid var(--bone); border-radius: 10px; padding: 8px; }
.promo button { width: 64px; height: 64px; border: 0; background: var(--sq-light); border-radius: 6px; cursor: pointer; position: relative; }
.promo button .pc { inset: 4%; }
.flash { position: absolute; inset: 0; z-index: 5; pointer-events: none; border-radius: 2px; }
.flash.bad { animation: flashbad .5s; } .flash.good { animation: flashgood .6s; }
@keyframes flashbad { 0%,100% { box-shadow: inset 0 0 0 0 transparent; } 30% { box-shadow: inset 0 0 0 8px var(--blood); } }
@keyframes flashgood { 0%,100% { box-shadow: inset 0 0 0 0 transparent; } 30% { box-shadow: inset 0 0 0 8px var(--moss); } }

/* barre d'outils sous l'échiquier */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tool { min-height: 40px; padding: 4px 12px; font-size: 14px; border-radius: 8px; }
.tool.on { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.swatches { display: inline-flex; gap: 6px; align-items: center; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch.on { border-color: var(--bone); box-shadow: 0 0 0 2px var(--ink) inset; }
.swatch[data-c="o"] { background: #e8a33d; } .swatch[data-c="g"] { background: #7cc46a; } .swatch[data-c="r"] { background: #d9534f; } .swatch[data-c="b"] { background: #5aa3e0; }
.arrow-help { font-size: 13px; color: var(--bone-dim); font-family: var(--mono); }

/* panneau du maître */
.lvl-title { display: grid; gap: 2px; }
.lvl-title h2 { margin: 0; font-size: clamp(36px, 8vw, 54px); transform: rotate(-1deg); }
.mentor { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start; }
.raven { width: 64px; height: 76px; }
.bubble {
  position: relative; min-width: 0; background: var(--bone); color: var(--ink); border-radius: 6px 22px 8px 18px;
  padding: 14px 16px; box-shadow: 4px 4px 0 var(--ink);
}
.bubble::before { content: ""; position: absolute; left: -12px; top: 22px; border: 8px solid transparent; border-right: 14px solid var(--bone); border-left: 0; }
.bubble b, .bubble strong { color: #000; }
.bubble .tag { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #5b4f6e; display: block; margin-bottom: 4px; }
.bubble .tag.good { color: #3e6b2c; } .bubble .tag.bad { color: #a3283d; }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble .why { border-left: 3px solid #b9a98a; padding-left: 10px; margin-bottom: 10px; }
.bubble .opp { font-style: italic; color: #3d3449; }
.bubble .ask { font-weight: 700; font-size: 18px; }
.bubble .think { display: inline-flex; gap: 4px; }
.bubble .think i { width: 7px; height: 7px; border-radius: 50%; background: #5b4f6e; animation: blink 1s infinite; }
.bubble .think i:nth-child(2) { animation-delay: .2s; } .bubble .think i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }
.choices { display: grid; gap: 8px; margin-top: 10px; }
.choice { text-align: left; background: #fff9ec; color: var(--ink); border: 2px solid #c9bb9e; border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 16px; }
.choice:hover { border-color: var(--ink); }
.choice.right { background: #dcebcf; border-color: #3e6b2c; } .choice.wrongc { background: #f3d2d6; border-color: #a3283d; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.mini-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 13px; color: var(--bone-dim); }
.mini-stats b { color: var(--bone); font-family: var(--mono); font-weight: 400; }

.carnet { border-top: 2px dashed #3b3250; padding-top: 10px; }
.carnet h3 { margin: 0 0 8px; font-family: var(--display); font-size: 28px; font-weight: 400; }
.carnet ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.carnet li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; font-size: 15px; }
.carnet .mv { font-family: var(--mono); color: var(--ember); }
.carnet .mv.opp { color: var(--bone-dim); }
.moves { font-family: var(--mono); font-size: 14px; line-height: 1.8; color: var(--bone-dim); max-height: 160px; overflow-y: auto; }
.moves span.n { color: #6d6382; margin-right: 4px; }
.moves span.m { margin-right: 10px; color: var(--bone); }

.result { text-align: center; padding: 6px 0; }
.result .big-stars { display: inline-flex; gap: 8px; }
.result .big-stars svg { width: 46px; height: 46px; }
.result h3 { font-family: var(--display); font-weight: 400; font-size: 44px; margin: 4px 0; }
.retenir { background: var(--night-2); border: 2px solid #3b3250; border-radius: 8px; padding: 12px 16px; text-align: left; }
.retenir h4 { margin: 0 0 6px; font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ember); font-weight: 400; }
.retenir ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* fenêtre modale */
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(8,6,12,.72); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
.modal .card { width: min(560px, 100%); max-height: 88vh; overflow-y: auto; background: var(--night-2); border: 2px solid #4a405e; border-radius: 10px 30px 12px 26px; padding: 22px; display: grid; gap: 12px; }
.modal h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; }
.opt-row { display: flex; flex-wrap: wrap; gap: 8px; }
.opt-row .btn.on { background: var(--bone); color: var(--ink); }
.help dt { font-weight: 700; margin-top: 8px; }
.help dd { margin: 2px 0 0; color: var(--bone-dim); }
.kbd { font-family: var(--mono); font-size: 13px; background: var(--night-3); border: 1px solid #4a405e; border-radius: 4px; padding: 1px 6px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bone); color: var(--ink); padding: 10px 18px; border-radius: 8px; z-index: 60; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); max-width: calc(100% - 32px); }

@media (max-width: 520px) {
  body { font-size: 16px; }
  .frame { padding: 6px; }
  .tomb { min-height: 190px; padding-top: 34px; }
  .mentor { grid-template-columns: 46px minmax(0, 1fr); }
  .raven { width: 46px; height: 56px; }
  .carnet li { grid-template-columns: 62px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.bubble .muted { color: #5b4f6e; }
.bubble .retenir { background: #f8f1df; border-color: #cdbf9f; color: var(--ink); }
.bubble .retenir h4 { color: #9a4f12; }
.bubble .result h3 { color: var(--ink); }

.home-top { display: flex; justify-content: flex-end; padding-top: 4px; }
.snd { display: inline-flex; gap: 6px; }
.snd-btn { width: 40px; height: 40px; color: var(--bone-dim); border-color: #3b3250; }
.snd-btn[aria-pressed="true"] { color: var(--ink); background: var(--bone); border-color: var(--bone); }
.snd-btn svg { width: 19px; height: 19px; }
.arrow-help { text-shadow: 0 0 3px var(--night), 0 0 8px var(--night), 0 0 14px var(--night); }

/* ---------- barre d'avantage ---------- */
.board-box { display: grid; gap: 6px; }
.board-wrap { display: flex; gap: 8px; align-items: stretch; }
.board-wrap .frame { flex: 1; min-width: 0; }
.evalbar { position: relative; flex: none; width: 24px; border-radius: 5px; overflow: hidden; background: #2b2438; box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 1px #4a405e; }
.evalbar[hidden] { display: none !important; }
.eval-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: repeating-linear-gradient(-45deg, #efe6d2 0 7px, #ddd2ba 7px 14px); transition: height .6s cubic-bezier(.3,.8,.3,1); }
.evalbar.flipped .eval-fill { bottom: auto; top: 0; }
.evalbar::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px dashed rgba(232,163,61,.65); }
.eval-num { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 10.5px; line-height: 1; letter-spacing: -.02em; z-index: 1; }
.eval-num.at-white { bottom: 5px; color: var(--ink); }
.eval-num.at-black { top: 5px; color: var(--bone); }
.evalbar.flipped .eval-num.at-white { bottom: auto; top: 5px; }
.evalbar.flipped .eval-num.at-black { top: auto; bottom: 5px; }
.evalbar.locked .eval-fill { background: repeating-linear-gradient(-45deg, #6d6382 0 7px, #5b5070 7px 14px); }
.evalbar.locked .eval-num { top: 50%; bottom: auto; transform: translateY(-50%); color: var(--bone); font-size: 15px; }
.evalbar.locked::after { display: none; }

/* ---------- pièces mangées ---------- */
.cap-row { display: flex; align-items: center; gap: 8px; min-height: 28px; padding-left: 32px; font-family: var(--mono); font-size: 13px; color: var(--bone-dim); }
.cap-who { flex: none; width: 54px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.cap-list { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-width: 0; }
.cap-grp { display: inline-flex; }
.cap-grp .pc { position: static; inset: auto; width: 24px; height: 24px; flex: none; filter: none; }
.cap-grp .pc + .pc { margin-left: -13px; }
.cap-grp .pc.w { --pf: #efe6d2; --ps: #0b0910; --pd: #0b0910; }
.cap-grp .pc.b { --pf: #1d1826; --ps: #e3d9c3; --pd: #9a8cb3; filter: none; }
.cap-adv { color: var(--ember); font-size: 15px; font-weight: 400; }
@media (max-width: 520px) {
  .evalbar { width: 15px; } .board-wrap { gap: 5px; }
  .eval-num { font-size: 8px; letter-spacing: -.06em; }
  .cap-row { padding-left: 20px; min-height: 24px; }
  .cap-grp .pc { width: 20px; height: 20px; } .cap-grp .pc + .pc { margin-left: -11px; }
  .cap-who { width: 46px; font-size: 10px; }
}

/* ---------- problème du jour ---------- */
.daily-card {
  margin-top: 26px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center;
  background: linear-gradient(135deg, #2c2539, #1f1a2b); border: 2px solid #5b5070; border-radius: 14px 40px 14px 34px;
  padding: 18px 22px; box-shadow: 0 10px 0 -4px var(--ink), inset 0 0 0 5px rgba(0,0,0,.15); max-width: 760px;
}
.mini-board { width: 168px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(8, 1fr); box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--bone), 0 0 0 9px var(--ink); transform: rotate(-2deg); }
.mini-board i { position: relative; display: block; }
.mini-board i.l { background: var(--sq-light); } .mini-board i.d { background: var(--sq-dark); }
.mini-board .pc { inset: 0; width: 100%; height: 100%; filter: none; }
.daily-info { min-width: 0; display: grid; gap: 6px; }
.daily-info h2 { margin: 0; font-size: clamp(38px, 7vw, 56px); color: var(--bone); transform: rotate(-1deg); }
.daily-info p { margin: 0; }
.dline { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.dstat { font-family: var(--mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--bone-dim); }
.dstat.ok { color: var(--ember); } .dstat.help { color: var(--moss); } .dstat.fail { color: var(--blood); }
.dnext { font-size: 14px; color: var(--bone-dim); }
.week { display: flex; gap: 8px; margin-top: 2px; }
.week .dot { display: grid; justify-items: center; gap: 2px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; color: var(--bone-dim); }
.week .dot i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #5b5070; }
.week .dot.ok i { background: var(--ember); border-color: var(--ember); }
.week .dot.help i { background: var(--moss); border-color: var(--moss); }
.week .dot.fail i { background: transparent; border-color: var(--blood); }
.week .dot.today i { border-style: dashed; border-color: var(--bone); }
.dactions { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 4px; }
.streak { font-family: var(--mono); font-size: 14px; color: var(--bone-dim); }
.streak b { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--ember); margin-right: 4px; vertical-align: -3px; }
.sol-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.sol-list li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; font-size: 15px; }
.sol-list .mv { font-family: var(--mono); color: #9a4f12; }
.sol-list li.opp .mv { color: #6d6382; }
.bubble .retenir + .retenir { margin-top: 10px; }
.bubble .retenir p { margin: 0; }
@media (max-width: 560px) {
  .daily-card { grid-template-columns: 1fr; justify-items: start; padding: 16px; gap: 16px; }
  .mini-board { width: min(200px, 60vw); justify-self: center; }
}

.savebar { margin-top: 10px; font-size: 13px; color: var(--bone-dim); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.savebar .ok { color: #8fd18f; } .savebar .bad { color: #e8a25a; }
.savebar .btn { padding: 4px 10px; font-size: 13px; }


/* ---------- bilan de partie ---------- */
.prog { height: 8px; border-radius: 4px; background: #d9cfb8; overflow: hidden; margin: 6px 0; }
.prog i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, #15121d 0 6px, #4d4561 6px 12px); transition: width .3s; }
.evgraph { margin-bottom: 8px; }
.evgraph svg { width: 100%; height: 66px; display: block; cursor: pointer; border-radius: 4px; box-shadow: 0 0 0 2px var(--ink); }
.mvlist { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 3px 6px; align-items: center; max-height: 230px; overflow-y: auto; padding-right: 4px; position: relative; }
.mvlist .n { font-family: var(--mono); font-size: 13px; color: #6d6382; }
.mvc { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 2px 8px; border-radius: 6px; border: 1.5px solid transparent; background: var(--night-3); color: var(--bone); cursor: pointer; font-family: var(--mono); font-size: 14px; text-align: left; }
.mvc i { font-style: normal; font-weight: 700; }
.mvc:hover { border-color: var(--violet); }
.mvc.cur { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.mvc.book { box-shadow: inset 3px 0 0 #9a78cf; }
.mvc.best { box-shadow: inset 3px 0 0 #8fb37a; }
.mvc.good { box-shadow: inset 3px 0 0 #6aa9e0; }
.mvc.inacc { box-shadow: inset 3px 0 0 #e8a33d; } .mvc.inacc i { color: #e8a33d; }
.mvc.mist { box-shadow: inset 3px 0 0 #e0743d; } .mvc.mist i { color: #e0743d; }
.mvc.blun { box-shadow: inset 3px 0 0 #d0566a; } .mvc.blun i { color: #d0566a; }
.mvc.cur i { color: var(--ink) !important; }
.rvtab { width: 100%; border-collapse: collapse; font-size: 15px; margin: 6px 0 10px; }
.rvtab th, .rvtab td { padding: 3px 6px; text-align: center; border-bottom: 1px solid #cdbf9f; }
.rvtab th:first-child, .rvtab td:first-child { text-align: left; }
.rvtab th { font-family: var(--mono); font-size: 12px; font-weight: 400; color: #5b4f6e; }
.rvtab tr.acc td { font-weight: 700; font-size: 18px; }
.dotc { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid #0b0910; }
.bubble a.kmv { color: #7a2b3a; font-weight: 700; }

/* ---------- révision, statistiques, import ---------- */
.rev-card { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; max-width: 760px; background: linear-gradient(135deg, #2a2338, #1f1a2b); border: 2px solid #5b5070; border-radius: 40px 14px 34px 14px; padding: 14px 22px; box-shadow: 0 10px 0 -4px var(--ink), inset 0 0 0 5px rgba(0,0,0,.15); }
.rev-card h2 { margin: 2px 0; font-size: clamp(34px, 6vw, 46px); color: var(--bone); transform: rotate(-1deg); }
.rev-card p { margin: 0; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; margin-top: 12px; }
.statbox { background: var(--night-2); border: 2px solid #3b3250; border-radius: 12px 28px 12px 24px; padding: 16px 18px; }
.statbox.wide { margin-top: 16px; }
.statbox h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 30px; }
.statbox .big { margin: 0; font-family: var(--display); font-size: 44px; color: var(--ember); line-height: 1.1; }
.statbox .big small { font-size: 22px; color: var(--bone-dim); }
.srow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 40px; gap: 8px; align-items: center; font-size: 14px; margin-top: 6px; }
.srow span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbar { height: 8px; border-radius: 4px; background: #1a1624; overflow: hidden; }
.sbar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--bone) 0 6px, var(--ink) 6px 12px); }
.spark { width: 100%; height: 70px; margin-top: 8px; border-radius: 4px; }
.glist { display: grid; gap: 6px; }
.grow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 80px 54px auto; gap: 8px; align-items: center; font-size: 15px; padding: 4px 0; border-bottom: 1px dashed #3b3250; }
.modal .grow { grid-template-columns: 56px minmax(0, 1fr) 76px auto; }
.grow .res.win { color: var(--moss); } .grow .res.lose { color: var(--blood); } .grow .res.draw { color: var(--bone-dim); }
.field { background: var(--night); color: var(--bone); border: 1.5px solid #4a405e; border-radius: 6px; padding: 8px 10px; font: inherit; min-height: 40px; flex: 1; min-width: 0; }
@media (max-width: 520px) { .grow { grid-template-columns: 52px minmax(0, 1fr) auto; } .grow .res, .grow span:nth-child(4) { display: none; } .modal .grow .res { display: inline; } }

      9: '1st field (piece positions) is invalid [invalid piece].',

    var last_sq = SQUARES.h1

    var legal =

    if (typeof options !== 'undefined' && 'square' in options) {

      if (i & 0x88) {

      if (piece.type === PAWN) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)

        }

        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]

          !attacked(them, castling_from + 1) &&

      if (castling[us] & BITS.QSIDE_CASTLE) {
        var castling_from = kings[us]
        var castling_to = castling_from - 2

        if (
          board[castling_from - 1] == null &&
          board[castling_from - 2] == null &&
          board[castling_from - 3] == null &&
          !attacked(them, kings[us]) &&
          !attacked(them, castling_from - 1) &&
          !attacked(them, castling_to)

     * to be captured)

    if (!legal) {

    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {

   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, sloppy) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      var disambiguator = get_disambiguator(move, sloppy)

      if (move.piece !== PAWN) {
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  // parses all of the decorators out of a SAN string
  function stripped_san(move) {
    return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
  }

  function attacked(color, square) {
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen()
        .split(' ')
        .slice(0, 4)
        .join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  /* this function is used to uniquely identify ambiguous moves */
  function get_disambiguator(move, sloppy) {
    var moves = generate_moves({ legal: !sloppy })

    var from = move.from
    var to = move.to
    var piece = move.piece

    var ambiguities = 0
    var same_rank = 0
    var same_file = 0

    for (var i = 0, len = moves.length; i < len; i++) {
      var ambig_from = moves[i].from
      var ambig_to = moves[i].to
      var ambig_piece = moves[i].piece

      /* if a move of the same piece type ends on the same to square, we'll
       * need to add a disambiguator to the algebraic notation
       */
      if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
        ambiguities++

        if (rank(from) === rank(ambig_from)) {
          same_rank++
        }

        if (file(from) === file(ambig_from)) {
          same_file++
        }
      }
    }

    if (ambiguities > 0) {
      /* if there exists a similar moving piece on the same rank and file as
       * the move in question, use the square as the disambiguator
       */
      if (same_rank > 0 && same_file > 0) {
        return algebraic(from)
      } else if (same_file > 0) {
        /* if the moving piece rests on the same file, use the rank symbol as the
         * disambiguator
         */
        return algebraic(from).charAt(1)
      } else {
        /* else use the file symbol */
        return algebraic(from).charAt(0)
      }
    }

    return ''
  }

  function ascii() {
    var s = '   +------------------------+\n'
    for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
      /* display the rank */
      if (file(i) === 0) {
        s += ' ' + '87654321'[rank(i)] + ' |'
      }

      /* empty piece */
      if (board[i] == null) {
        s += ' . '
      } else {
        var piece = board[i].type
        var color = board[i].color
        var symbol = color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
        s += ' ' + symbol + ' '
      }

      if ((i + 1) & 0x88) {
        s += '|\n'
        i += 8
      }
    }
    s += '   +------------------------+\n'
    s += '     a  b  c  d  e  f  g  h\n'

    return s
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?!
    var clean_move = stripped_san(move)

    // if we're using the sloppy parser run a regex to grab piece, to, and from
    // this should parse invalid SAN like: Pe2-e4, Rc1c4, Qf3xf7
    if (sloppy) {
      var matches = clean_move.match(
        /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
      )
      if (matches) {
        var piece = matches[1]
        var from = matches[2]
        var to = matches[3]
        var promotion = matches[4]
      }
    }

    var moves = generate_moves()
    for (var i = 0, len = moves.length; i < len; i++) {
      // try the strict parser first, then the sloppy parser if requested
      // by the user
      if (
        clean_move === stripped_san(move_to_san(moves[i])) ||
        (sloppy && clean_move === stripped_san(move_to_san(moves[i], true)))
      ) {
        return moves[i]
      } else {
        if (
          matches &&
          (!piece || piece.toLowerCase() == moves[i].piece) &&
          SQUARES[from] == moves[i].from &&
          SQUARES[to] == moves[i].to &&
          (!promotion || promotion.toLowerCase() == moves[i].promotion)
        ) {
          return moves[i]
        }
      }
    }

    return null
  }

  /*****************************************************************************
   * UTILITY FUNCTIONS
   ****************************************************************************/
  function rank(i) {
    return i >> 4
  }

  function file(i) {
    return i & 15
  }

  function algebraic(i) {
    var f = file(i),
      r = rank(i)
    return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
  }

  function swap_color(c) {
    return c === WHITE ? BLACK : WHITE
  }

  function is_digit(c) {
    return '0123456789'.indexOf(c) !== -1
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, false)
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  function clone(obj) {
    var dupe = obj instanceof Array ? [] : {}

    for (var property in obj) {
      if (typeof property === 'object') {
        dupe[property] = clone(obj[property])
      } else {
        dupe[property] = obj[property]
      }
    }

    return dupe
  }

  function trim(str) {
    return str.replace(/^\s+|\s+$/g, '')
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC CONSTANTS (is there a better way to do this?)
     **************************************************************************/
    WHITE: WHITE,
    BLACK: BLACK,
    PAWN: PAWN,
    KNIGHT: KNIGHT,
    BISHOP: BISHOP,
    ROOK: ROOK,
    QUEEN: QUEEN,
    KING: KING,
    SQUARES: (function() {
      /* from the ECMA-262 spec (section 12.6.4):
       * "The mechanics of enumerating the properties ... is
       * implementation dependent"
       * so: for (var sq in SQUARES) { keys.push(sq); } might not be
       * ordered correctly
       */
      var keys = []
      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (i & 0x88) {
          i += 7
          continue
        }
        keys.push(algebraic(i))

      return keys

    FLAGS: FLAGS,

    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function(fen) {
      return load(fen)
    },

    reset: function() {
      return reset()
    },

    moves: function(options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(move_to_san(ugly_moves[i], false))
        }
      }

      return moves
    },

    in_check: function() {
      return in_check()
    },

    in_checkmate: function() {
      return in_checkmate()
    },

    in_stalemate: function() {
      return in_stalemate()
    },

    in_draw: function() {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function() {
      return insufficient_material()
    },

    in_threefold_repetition: function() {
      return in_threefold_repetition()
    },

    game_over: function() {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function(fen) {
      return validate_fen(fen)
    },

    fen: function() {
      return generate_fen()
    },

    board: function() {
      var output = [],
        row = []

      for (var i = SQUARES.a8; i <= SQUARES.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({ type: board[i].type, color: board[i].color })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function(options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header headerrmation */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with 1. ... */
        if (!history.length && move.color === 'b') {
          move_string = move_number + '. ...'
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string = move_string + ' ' + move_to_san(move, false)
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(move_string)
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what is was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        /* if the current move will push past max_width */
        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */
          if (result[result.length - 1] === ' ') {
            result.pop()
          }

          result.push(newline)
          current_width = 0
        } else if (i !== 0) {
          result.push(' ')
          current_width++
        }
        result.push(moves[i])
        current_width += moves[i].length
      }

      return result.join('')
    },

    load_pgn: function(pgn, options) {
      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      function mask(str) {
        return str.replace(/\\/g, '\\')
      }

      function has_keys(object) {
        for (var key in object) {
          return true
        }
        return false
      }

      function parse_pgn_header(header, options) {
        var newline_char =
          typeof options === 'object' &&
          typeof options.newline_char === 'string'
            ? options.newline_char
            : '\r?\n'
        var header_obj = {}
        var headers = header.split(new RegExp(mask(newline_char)))
        var key = ''
        var value = ''

        for (var i = 0; i < headers.length; i++) {
          key = headers[i].replace(/^\[([A-Z][A-Za-z]*)\s.*\]$/, '$1')
          value = headers[i].replace(/^\[[A-Za-z]+\s"(.*)"\]$/, '$1')
          if (trim(key).length > 0) {
            header_obj[key] = value
          }
        }

        return header_obj
      }

      var newline_char =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\r?\n'

      // RegExp to split header. Takes advantage of the fact that header and movetext
      // will always have a blank line between them (ie, two newline_char's).
      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\r?\n){2}/
      var header_regex = new RegExp(
        '^(\\[((?:' +
          mask(newline_char) +
          ')|.)*\\])' +
          '(?:' +
          mask(newline_char) +
          '){2}'
      )

      // If no header given, begin with moves.
      var header_string = header_regex.test(pgn)
        ? header_regex.exec(pgn)[1]
        : ''

      // Put the board in the starting position
      reset()

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      for (var key in headers) {
        set_header([key, headers[key]])
      }

      /* load the starting position indicated by [Setup '1'] and
       * [FEN position] */
      if (headers['SetUp'] === '1') {
        if (!('FEN' in headers && load(headers['FEN'], true))) {
          // second argument to load: don't clear the headers
          return false

      /* delete header to get the moves */
      var ms = pgn
        .replace(header_string, '')
        .replace(new RegExp(mask(newline_char), 'g'), ' ')

      ms = ms.replace(/(\{[^}]+\})+?/g, '')

      /* delete recursive annotation variations */
      var rav_regex = /(\([^\(\)]+\))+?/g

CHAPTERS.push({ id: 'pieges', title: "Les Pièges de l'Italienne", sub: 'Les gagner, les éviter', icon: 'trap', lockEval: true,

/* ---------- barre d'avantage et pièces mangées ---------- */
var evalPref = true;

function attachExtras(board) {
  var bar = $('#evalbar'), fill = $('#eval-fill'), num = $('#eval-num'), top = $('#cap-top'), bot = $('#cap-bot');
  board.evalLocked = false; board.evalData = null;
  var timer = null;
  function capsHtml(fen) {
    var cnt = { w: {}, b: {} }, rows = fen.split(' ')[0];
    for (var i = 0; i < rows.length; i++) { var c = rows[i]; if (/[pnbrqPNBRQ]/.test(c)) { var col = c === c.toUpperCase() ? 'w' : 'b', t = c.toLowerCase(); cnt[col][t] = (cnt[col][t] || 0) + 1; } }
    var val = { w: 0, b: 0 };
    ['w', 'b'].forEach(function (col) { CAP_ORDER.forEach(function (t) { val[col] += (cnt[col][t] || 0) * PVAL[t]; }); });
    // pièces mangées PAR une couleur = pièces adverses manquantes
    function taken(by) {
      var opp = by === 'w' ? 'b' : 'w', html = '';
      CAP_ORDER.forEach(function (t) {
        var n = Math.max(0, INIT[t] - (cnt[opp][t] || 0));
        if (!n) return;
        html += '<span class="cap-grp">';
        for (var k = 0; k < n; k++) html += '<svg class="pc ' + opp + '" viewBox="0 0 45 45"><use href="#p' + t.toUpperCase() + '"/></svg>';
        html += '</span>';
      });
      var d = val[by] - val[opp];
      return { html: html, adv: d > 0 ? '<span class="cap-adv">+' + d + '</span>' : '' };
    }
    return { w: taken('w'), b: taken('b') };
  }
  function drawCaps() {
    if (!board.fen) return;
    var c = capsHtml(board.fen), botCol = board.orient, topCol = botCol === 'w' ? 'b' : 'w';
    var name = function (col) { return '<span class="cap-who">' + (col === 'w' ? 'Blancs' : 'Noirs') + '</span>'; };
    bot.innerHTML = name(botCol) + '<span class="cap-list">' + c[botCol].html + '</span>' + c[botCol].adv;
    top.innerHTML = name(topCol) + '<span class="cap-list">' + c[topCol].html + '</span>' + c[topCol].adv;
  }
  function drawBar() {
    bar.classList.toggle('flipped', board.orient === 'b');
    bar.hidden = !evalPref;
    var d = board.evalData, pct = 50, label = '0.0', whiteGood = true;
    if (board.evalLocked) { bar.classList.add('locked'); fill.style.height = '50%'; num.textContent = '?'; bar.title = 'Masquée pendant le problème'; return; }
    bar.classList.remove('locked'); bar.title = '';
    if (d) {
      if (d.result) { pct = d.result === '1-0' ? 100 : d.result === '0-1' ? 0 : 50; label = d.result; whiteGood = d.result !== '0-1'; }
      else if (d.mate !== null) { pct = d.mate > 0 ? 100 : 0; label = 'M' + Math.abs(d.mate); whiteGood = d.mate > 0; }
      else {
        var cp = d.cp; pct = 50 + 50 * (2 / (1 + Math.exp(-cp / 260)) - 1); pct = Math.max(4, Math.min(96, pct));
        label = (Math.abs(cp) / 100).toFixed(1); if (Math.abs(cp) >= 1000) label = Math.round(Math.abs(cp) / 100) + '';

function checkSq(G) {
  if (!G.in_check()) return null;
  var t = G.turn(), b = G.board();
  for (var r = 0; r < 8; r++) for (var f = 0; f < 8; f++) { var p = b[r][f]; if (p && p.type === 'k' && p.color === t) return 'abcdefgh'[f] + (8 - r); }
  return null;
}

// Analyse d'un mauvais coup : pièce en prise ? mat permis ?
function blunderNote(fenAfter, m) {
  try {
    var pos = new Engine.Pos().load(fenAfter);
    var replies = pos.legal();
    for (var i = 0; i < replies.length; i++) {
      pos.make(replies[i]);
      var mate = pos.legal().length === 0 && pos.inCheck();
      pos.undo();
      if (mate) return 'Attention : ce coup permet un <b>mat en un coup</b> à l\'adversaire.';
    }
    var to = m.to, s120 = 21 + (to.charCodeAt(0) - 97) + (7 - (+to[1] - 1)) * 10;
    var them = m.color === 'w' ? 8 : 0, us = m.color === 'w' ? 0 : 8;
    if (m.piece !== 'k' && pos.attacked(s120, them)) {
      if (!pos.attacked(s120, us)) return 'Attention : ton ' + PNAME[m.piece] + ' en ' + to + ' peut être pris <b>gratuitement</b>.';
      if (PVAL[m.piece] >= 3) {
        var pawnSq = them === 8 ? [s120 - 9, s120 - 11] : [s120 + 9, s120 + 11];
        if (pawnSq.some(function (q) { return pos.b[q] === (1 | them); })) return 'Attention : ton ' + PNAME[m.piece] + ' en ' + to + ' peut être pris par un pion.';
      }
    }
  } catch (e) {}
  return '';
}

  r.board.orient = L.side === 'b' ? 'b' : 'w';
  if (L.type === 'mate' || ch.id === 'tac' || ch.lockEval) r.board.lockEval(true);
  r.board.movesFn = function (from) { return r.G.moves({ square: from, verbose: true }).map(function (m) { return { to: m.to, promo: !!m.promotion }; }); };
  r.board.onMove = function (from, to, promo) { if (!r.dead && r.onUser) r.onUser(from, to, promo); };

  r.board.mentor = L.introAr || [];

    var pick = function (k) { botLevel = k; actions(levelButtons()); };
    var levelButtons = function () {
      return Object.keys(LEVELS).map(function (k) { return { label: LEVELS[k].label + (botLevel === k ? ' ✓' : ''), small: true, onClick: function () { pick(k); } }; })
        .concat([{ label: 'Commencer', primary: true, onClick: function () { r.board.mentor = []; runGame(r, L.side, botLevel); } }]);

}

/* ---------- indices ---------- */

  var st = r.cur;

  var t = new Chess(r.G.fen()), m = t.move(st.u);

}
function giveHint(r) {

  var em = expectedMove(r), txt = '';
  if (r.hintLevel === 1) txt = (r.cur && r.cur.hint) || r.L.hint || r.L.tip || 'Relis la consigne : que demande Corvin ?';
  if (r.hintLevel === 2 && em) { r.board.hintSq = em.from; r.board.render(); txt = 'La pièce à jouer brille sur l\'échiquier.'; }
  if (r.hintLevel === 3 && em) { r.board.mentor = ['g:' + em.from + em.to]; r.board.hintSq = em.from; r.board.render(); txt = 'Voici le coup : suis la flèche verte. Essaie de comprendre pourquoi avant de le jouer !'; }
  var b = $('#bubble'); if (b) { var p = document.createElement('p'); p.innerHTML = '<b>Indice ' + r.hintLevel + ' :</b> ' + txt; b.appendChild(p); }

}

/* ---------- leçons et tactiques ---------- */
function runLine(r) {

    r.board.mentor = []; sync(r);

    setTimeout(function () {

}
function lineUser(r, from, to, promo) {

/* ---------- mats ---------- */
function runMate(r) {
  var L = r.L;

}

  callEngine('mateCheck', { fen: r.G.fen(), n: r.n }).then(function (wins) {

    var pref = st && st.u && r.onScript ? (function () { var t = new Chess(r.G.fen()), m = t.move(st.u); return m ? m.from + m.to + (m.promotion || '') : null; })() : null;
    r.cur = { uci: pref || r.wins[0], hint: r.solIdx === 0 ? L.hint : 'Le roi n\'a presque plus de cases. Quelle pièce peut finir le travail ?' };
    clearHint(r);
    bubble('À toi · ' + (L.side === 'w' ? 'Blancs' : 'Noirs'), '', (before || '') + '<p class="ask">Trouve le mat en ' + r.n + ' coup' + (r.n > 1 ? 's' : '') + '.</p>');
    actions([hintAction(r), restartAction(r)]);

  });
}
function mateUser(r, from, to, promo) {

  Sound.forMove(r.G, m);
  var uci = m.from + m.to + (m.promotion || '');
  var L = r.L;
  r.lock = true; r.board.setSide(null); r.board.hintSq = null;
  if (r.wins.indexOf(uci) >= 0 || r.G.in_checkmate()) {
    r.last = [m.from, m.to]; sync(r); r.board.flash('good');
    var st = L.sol[r.solIdx], why;
    if (r.onScript && st && st.u && norm(st.u) === norm(m.san)) { why = st.why; r.solIdx++; }
    else { r.onScript = false; why = '<b>' + fr(m.san) + '</b> : bien vu, ça marche aussi !'; }
    addCarnet(r, moveLabel(r.G, m), why);
    if (st && st.ar) { r.board.mentor = st.ar; r.board.render(); }
    if (r.G.in_checkmate()) {
      bubble('Échec et mat !', 'good', '<div class="why">' + why + '</div>');
      actions([{ label: 'Terminer', primary: true, onClick: function () { finishLevel(r); } }]);
      return;
    }
    r.n--;
    bubble('Bien joué', 'good', '<div class="why">' + why + '</div>' + thinking('L\'adversaire cherche une défense'));
    var next = L.sol[r.solIdx];
    var p = r.onScript && next && next.o ? Promise.resolve(next.o) : callEngine('mateDef', { fen: r.G.fen(), n: r.n });
    p.then(function (mv) {

        var om = next && next.o && r.onScript ? r.G.move(mv) : r.G.move({ from: mv.slice(0, 2), to: mv.slice(2, 4), promotion: mv[4] || 'q' });
        Sound.forMove(r.G, om);
        if (r.onScript && next && next.o) r.solIdx++;
        r.last = [om.from, om.to]; sync(r, true);
        var say = (r.onScript && next && next.say) || '';
        addCarnet(r, moveLabel(r.G, om), say, true);
        mateAsk(r, '<div class="why">' + why + '</div><p class="opp"><b>' + moveLabel(r.G, om) + '</b> ' + say + '</p>');

    });

  }

  srsAdd(fenBefore, (r.wins || []).map(function (u) { return sanOf(fenBefore, u); }).filter(Boolean), 'Un mat en ' + (L.n || 1) + ' existait ici : cherche le roi adverse et ses cases de fuite.', r.L ? 'Mat : ' + r.L.t : '', 'mate');
  r.board.render(r.G.fen(), { last: [m.from, m.to], check: checkSq(r.G) }); r.board.animate(m.from, m.to); r.board.flash('bad');
  var fenAfter = r.G.fen();
  var msgP;
  if (r.G.in_stalemate()) msgP = Promise.resolve('<b>Pat !</b> Le roi adverse n\'a plus de coup mais n\'est pas en échec : c\'est nulle. Attention à ce piège.');

    var note = blunderNote(fenAfter, m);

  });
  msgP.then(function (msg) {
    if (r.dead) return;
    bubble('Pas encore', 'bad', '<p><b>' + fr(m.san) + '</b> : ' + msg + '</p><p class="ask">Trouve le mat en ' + r.n + ' coup' + (r.n > 1 ? 's' : '') + '.</p>');

}

/* ---------- finales jouées contre le bot ---------- */
function countPieces(G, color, type) { var n = 0; G.board().forEach(function (row) { row.forEach(function (p) { if (p && p.color === color && (!type || p.type === type)) n++; }); }); return n; }

function runPlay(r) {
  var L = r.L;
  r.moves = 0;
  r.onUser = function (from, to, promo) { playUser(r, from, to, promo); };
  playAsk(r, null);
}
function playGoalText(L, r) {
  var left = L.max - r.moves;
  if (L.goal === 'mate') return 'Mate le roi noir. Il te reste <b>' + left + '</b> coup' + (left > 1 ? 's' : '') + '.';
  if (L.goal === 'promote') return 'Amène ton pion à dame (le bot défend parfaitement). Coups restants : <b>' + left + '</b>.';
  if (L.goal === 'catch') return 'Rattrape le pion noir avant qu\'il devienne dame.';
  if (L.goal === 'hold') return 'Tiens la nulle : empêche le pion de passer. Encore <b>' + left + '</b> coup' + (left > 1 ? 's' : '') + ' à tenir.';

}
function playAsk(r, before) {
  if (r.dead) return;
  var L = r.L;
  r.cur = { hint: L.tip };
  clearHint(r);
  bubble('À toi · ' + (L.side === 'w' ? 'Blancs' : 'Noirs'), '', (before || '') + '<p class="ask">' + playGoalText(L, r) + '</p>');
  actions([{ label: 'Conseil', onClick: function () { playHint(r); } }, restartAction(r)]);

}

  var b = $('#bubble');

    if (uci) { r.board.mentor = ['g:' + uci.slice(0, 4)]; r.board.render(); }
    if (b) { var p = document.createElement('p'); p.innerHTML = '<b>Conseil :</b> ' + txt; b.appendChild(p); }
  };
  if (L.goal === 'catch') {
    var pw = findPiece(r.G, 'b', 'p'), kms = r.G.moves({ verbose: true }).filter(function (m) { return m.piece === 'k'; }), bestK = null, bk = 99;
    if (pw) kms.forEach(function (m) { var d = +pw[1] - 1; if (cheb(m.to, pw[0] + '1') <= d) { var c = cheb(m.to, pw); if (c < bk) { bk = c; bestK = m; } } });
    var capQ = r.G.moves({ verbose: true }).filter(function (m) { return m.captured === 'q'; })[0];
    if (capQ) { show(capQ.from + capQ.to, 'La nouvelle dame est à portée de ton roi : prends-la !'); return; }
    if (bestK) show(bestK.from + bestK.to, 'Reste dans le carré du pion (de ' + pw + ' jusqu\'à la rangée 1) et rapproche-toi de lui.');

  }

        if (safe) { best = i; bd = -1; }
      });
      if (bd >= 0) res.forEach(function (x, i) {
        if (!x) return;
        if (L.goal === 'promote' && x.win && x.dist < bd) { bd = x.dist; best = i; }
        if (L.goal === 'hold' && !x.win && best < 0) best = i;
      });
      if (best >= 0) show(ms[best].from + ms[best].to, L.tip + ' Un bon coup est indiqué par la flèche verte.');

    });

  }

}
function playFail(r, html) {

}

    setTimeout(function () { if (r.dead) return; G.undo(); var h = G.history({ verbose: true }); r.last = h.length ? [h[h.length - 1].from, h[h.length - 1].to] : null; sync(r); playAsk(r, null); }, 1800);
  };

  if (L.goal === 'promote' && m.promotion) {
    if (G.in_stalemate()) return takeBack('<b>Pat !</b> Le roi noir n\'a plus de coup et n\'est pas en échec : c\'est nulle. Promeus plutôt quand le roi noir garde une case, ou fais une tour.');
    if (G.moves({ verbose: true }).some(function (x) { return x.to === m.to; })) return takeBack('ta nouvelle ' + PNAME[m.promotion] + ' peut être prise tout de suite par le roi noir. Protège d\'abord la case de promotion avec ton roi.');
  }
  if (L.bot === 'kpk' || L.bot === 'kpkw') {

        }

function winPlay(r, html) {

}
function botPlay(r) {
  var L = r.L, G = r.G;
  bubble('Au bot', '', thinking('Le défenseur réfléchit'));
  var ms = G.moves({ verbose: true });
  var choose;
  if (L.bot === 'rush') {
    var push = ms.filter(function (m) { return m.piece === 'p'; });
    choose = Promise.resolve(push.length ? push[0] : null).then(function (m) { return m || callEngine('search', { fen: G.fen(), depth: 3, nodes: 60000 }).then(function (s) { return s.uci; }); });

    var fens = ms.map(function (m) { G.move(m); var f = G.fen(); G.undo(); return f; });
    choose = kpkEval(fens).then(function (res) {
      var pick = null, score = -1e9;
      ms.forEach(function (m, i) {
        var x = res[i], s;

      return pick;
    });
  } else {
    choose = callEngine('search', { fen: G.fen(), depth: 3, nodes: 120000 }).then(function (s) { return s.uci; });
  }

    if (r.dead) return;
    var mv = res[0], om;
    if (!mv) return;
    om = typeof mv === 'string' ? G.move({ from: mv.slice(0, 2), to: mv.slice(2, 4), promotion: mv[4] || 'q' }) : G.move(mv);
    Sound.forMove(G, om);
    r.last = [om.from, om.to]; sync(r, true);
    addCarnet(r, moveLabel(G, om), '', true);
    if (L.goal === 'catch' && om.promotion && !G.moves({ verbose: true }).some(function (x) { return x.to === om.to; })) return playFail(r, '<p>Le pion est devenu dame : ton roi est resté hors du carré.</p>');
    if (L.goal === 'promote' && countPieces(G, 'w', 'p') === 0) return playFail(r, '<p>Le roi noir a pris ton pion.</p>');
    if (L.goal === 'hold' && om.promotion) return playFail(r, '<p>Le pion blanc a fait dame.</p>');
    if (G.in_checkmate()) return playFail(r, '<p>Tu es mat !</p>');
    if (L.goal === 'mate' && G.insufficient_material()) return playFail(r, '<p>Plus assez de matériel pour mater.</p>');
    playAsk(r, '<p class="opp"><b>' + moveLabel(G, om) + '</b></p>');
  });
}

/* ---------- parties contre le bot (épreuves et partie libre) ---------- */
function runGame(r, side, lvl) {

  r.G.reset(); r.last = null; r.board.mentor = []; r.board.orient = side === 'b' ? 'b' : 'w'; sync(r); r.board.drawExtras();

  if (r.G.turn() !== side) botGame(r); else gameAsk(r, '<p>Tu joues les <b>' + (side === 'w' ? 'Blancs' : 'Noirs') + '</b> contre ' + BOT + ' (' + r.lvl.label + ').</p>');

function gameStats(r) {

}
function gameActions(r) {

}
function gameUndo(r) {

function gameHint(r) {

  callEngine('search', { fen: r.G.fen(), depth: 4, nodes: 400000 }).then(function (s) {

function gameOverCheck(r) {

function gameUser(r, from, to, promo) {

function botGame(r) {
  if (r.dead || r.over) return;

  bubble('Au bot', '', thinking(BOT.charAt(0).toUpperCase() + BOT.slice(1) + ' réfléchit'));
  actions([]);
  var key = G.history().join(' '), book = BOOK[key];
  var legal = G.moves();
  var bookMove = book ? book.filter(function (b) { return legal.indexOf(b) >= 0; }) : [];
  var p = bookMove.length ? Promise.resolve({ san: bookMove[Math.floor(Math.random() * bookMove.length)] }) :
    callEngine('search', { fen: G.fen(), depth: r.lvl.depth, nodes: r.lvl.nodes, all: r.lvl.noise > 0 }).then(function (s) {
      if (!s || !s.uci) return null;

      var pick = pool[Math.floor(Math.random() * pool.length)] || s.top[0];

    var m = x.san ? G.move(x.san) : G.move({ from: x.uci.slice(0, 2), to: x.uci.slice(2, 4), promotion: x.uci[4] || 'q' });
    Sound.forMove(G, m);

function gameEnd(r, result, html) {

  if (r.L && result === 'win') {

    return;
  }
  bubble(result === 'win' ? 'Victoire' : result === 'draw' ? 'Nulle' : 'Défaite', result === 'win' ? 'good' : 'bad', '<p>' + html + '</p>' + (result !== 'win' ? '<p>Ouvre le bilan : il te montre coup par coup où la partie a basculé.</p>' : ''));
  var list = [reviewBtn, { label: 'Rejouer', primary: !reviewBtn, onClick: function () { if (r.L) startLevel(r.ch, r.levelIdx); else startFree(r.side, r.lvlKey); } }];

/* ---------- fin de niveau ---------- */
function finishLevel(r) {
  if (r.dead) return;
  if (r.daily) return finishDaily(r, r.errors + r.hints === 0 ? 'ok' : 'help');
  var L = r.L, ch = r.ch, st = computeStars(r);
  if (r.board.evalLocked) r.board.lockEval(false);
  var prev = starsOf(L.id);
  if (st > prev) { progress.stars[L.id] = st; saveProgress(); }
  r.board.setSide(null);
  var next = r.levelIdx + 1 < ch.levels.length ? r.levelIdx + 1 : null;
  var ci = CHAPTERS.indexOf(ch);
  Sound.play('win', 0.2);
  var html = '<div class="result">' + starsHtml(st, 'big-stars') + '<h3>Niveau réussi</h3><p class="muted">' +
    (st === 3 ? 'Parfait : sans erreur ni indice.' : st === 2 ? 'Très bien. Rejoue-le sans aide pour la 3e étoile.' : 'Réussi ! Rejoue-le pour gagner plus d\'étoiles.') + '</p></div>' +
    (L.sum && L.sum.length ? '<div class="retenir"><h4>À retenir</h4><ul>' + L.sum.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul></div>' : '');
  bubble('', '', html);
  var list = [];
  if (next !== null) list.push({ label: 'Niveau suivant', primary: true, onClick: function () { startLevel(ch, next); } });
  else if (ci + 1 < CHAPTERS.length) list.push({ label: 'Chapitre suivant', primary: true, onClick: function () { go('chapter', CHAPTERS[ci + 1]); } });
  list.push({ label: 'Rejouer', onClick: function () { startLevel(ch, r.levelIdx); } });
  list.push({ label: 'Chapitre', onClick: function () { go('chapter', ch); } });
  if (L.type === 'game' && r.G.history().length >= 6) list.push({ label: 'Bilan de la partie', onClick: function () { openGameReview(r, 'win'); } });
  actions(list);
}


/* =================== problème du jour =================== */
var DAILY_EPOCH = Date.UTC(2026, 9, 21); // 21 octobre 2026 = problème n° 1
var DAILY_COUNT = 364;
function dateKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dayIndex(d) {
  var n = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - DAILY_EPOCH) / 86400000);
  return ((n % DAILY_COUNT) + DAILY_COUNT) % DAILY_COUNT;
}
function dailyAt(d) { return { key: dateKey(d), idx: dayIndex(d), date: d, P: DAILY[dayIndex(d) % DAILY.length] }; }
function todayDaily() { return dailyAt(new Date()); }
/* problèmes des jours passés (depuis le n° 1) jamais joués : ils restent disponibles */
function pendingDaily() {
  var now = new Date(), n0 = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - DAILY_EPOCH) / 86400000), out = [];
  for (var n = Math.max(0, n0 - DAILY_COUNT + 1); n < n0; n++) {
    var d = new Date(2026, 9, 21 + n), rec = progress.daily[dateKey(d)];
    if (!rec || !rec.res) out.push(dailyAt(d));
  }
  return out;
}
function dailyKind(P) { return P.t === 'm1' ? 'Mat en 1' : P.t === 'm2' ? 'Mat en 2' : 'Meilleur coup'; }
function untilMidnight() {
  var now = new Date(), m = new Date(now); m.setHours(24, 0, 0, 0);
  var min = Math.max(1, Math.round((m - now) / 60000)), h = Math.floor(min / 60);
  return h ? h + ' h ' + ('0' + (min % 60)).slice(-2) : (min % 60) + ' min';
}

  var d = new Date(), n = 0, rec = progress.daily[dateKey(d)];
  if (!rec || !rec.res) d.setDate(d.getDate() - 1); // la série continue tant qu'aujourd'hui n'est pas raté
  for (var i = 0; i < 400; i++) {
    rec = progress.daily[dateKey(d)];
    if (!rec || rec.late || (rec.res !== 'ok' && rec.res !== 'help')) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}
function miniBoard(fen, orient) {

  for (var r = 0; r < 8; r++) { var f = 0; for (var i = 0; i < rows[r].length; i++) { var c = rows[r][i]; if (/\d/.test(c)) { for (var k = 0; k < +c; k++) cells.push({ r: r, f: f++ }); } else cells.push({ r: r, f: f++, p: c }); } }
  if (orient === 'b') cells.reverse();
  return '<div class="mini-board" aria-hidden="true">' + cells.map(function (x) {
    var light = (x.r + x.f) % 2 === 0;
    return '<i class="' + (light ? 'l' : 'd') + '">' + (x.p ? pieceSvg(x.p === x.p.toUpperCase() ? 'w' : 'b', x.p.toLowerCase()) : '') + '</i>';
  }).join('') + '</div>';
}
function weekDots() {
  var out = '', d = new Date(); d.setDate(d.getDate() - 6);
  for (var i = 0; i < 7; i++) {
    var rec = progress.daily[dateKey(d)], cls = rec && rec.res ? rec.res : (i === 6 ? 'today' : 'miss');
    var lab = d.toLocaleDateString('fr-FR', { weekday: 'narrow' });
    out += '<span class="dot ' + cls + '" title="' + d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + '"><i></i>' + lab + '</span>';
    d.setDate(d.getDate() + 1);

}
function dailyCardHtml() {
  if (typeof DAILY === 'undefined' || !DAILY.length) return '';
  var T = todayDaily(), rec = progress.daily[T.key], done = rec && rec.res, streak = dailyStreak(), pend = pendingDaily();
  var status = done ? (rec.res === 'ok' ? '<span class="dstat ok">Réussi du premier coup</span>' : rec.res === 'help' ? '<span class="dstat help">Réussi avec de l\'aide</span>' : '<span class="dstat fail">Solution vue</span>') +
    '<span class="dnext" id="daily-next">Prochain problème dans ' + untilMidnight() + '</span>' : (rec ? '<span class="dstat">En cours</span>' : '<span class="dstat">À résoudre aujourd\'hui</span>');

    '<span class="streak"><b>' + streak + '</b> jour' + (streak > 1 ? 's' : '') + ' de suite</span></div>' +
    (pend.length ? '<div class="dactions"><button class="btn" id="daily-late">Rattraper un problème en retard (' + pend.length + ')</button></div>' : '') + '</div></section>';

var dailyTimer = null;
function wireDailyCard() {

function reviewComment(r, i) {

  var bm = mateOf(inf.best.score);

    html = desc + '<p>Coup de théorie : ' + (inf.book && inf.book.rep && who === 'user' ? 'c\'est exactement ce que prévoit ton répertoire à cet endroit.' : 'un coup d\'ouverture classique, joué dans de nombreuses parties.') + '</p>';
    if (inf.loss >= 8) html += '<p class="muted">Le moteur rapide juge ce coup risqué, car il ne voit pas la compensation : c\'est un sacrifice de théorie, il est volontaire.</p>';
  } else if (inf.cls === 'best') {
    html = desc + '<p>' + (who === 'opp' ? 'Un bon coup du bot : le moteur aurait joué la même chose.' : 'C\'est le meilleur coup de la position selon le moteur.') + (bm && bm > 0 ? ' Il mène à un <b>mat en ' + bm + '</b>.' : '') + '</p>';
  } else if (inf.cls === 'good') {
    html = desc + '<p>Un bon coup. Le moteur préférait ' + bestTxt + ', mais l\'écart reste faible.</p>';
    altArrows = ['o:' + inf.uci.slice(0, 4), 'g:' + inf.best.uci.slice(0, 4)];
  } else {
    var rep = replyOf(r, i), lines = [];

      if (rep) { html += '<p>Tu pouvais en profiter avec <b>' + fr(rep.m.san) + '</b>' + (rep.m.captured ? ' (tu gagnes ' + UN[rep.m.captured] + ')' : '') + ' (flèche verte).</p>'; arrows = ['g:' + rep.uci.slice(0, 4)]; }

      else html += '<p>Le meilleur coup était ' + bestTxt + (bestMv ? ' : ' + describeMove(bestMv, i) : '') + '.</p>';
      var rs = mateOf(-inf.mine.score);

      else if (rep) html += '<p>Après ton coup, l\'adversaire peut répondre <b>' + fr(rep.m.san) + '</b>' + (rep.m.captured ? ' et prendre ' + (rep.m.captured === 'p' ? 'un pion' : UN[rep.m.captured]) : '') + ' (flèche rouge).</p>';
      if (rep) arrows = ['r:' + rep.uci.slice(0, 4)];

      if (note) html += '<p>' + note + '</p>';
      if (bestMv && bestMv.captured && !m.captured) html += '<p><i>Leçon : avant de jouer, regarde toutes les prises possibles.</i></p>';
      else if (bestMv && /[+#]/.test(bestMv.san) && !/[+#]/.test(m.san)) html += '<p><i>Leçon : pense à regarder les échecs avant de choisir.</i></p>';
      var prev = i > 0 ? moveInfo(r, i - 1) : null;
      if (prev && whoOf(r, i - 1) === 'opp' && (prev.cls === 'mist' || prev.cls === 'blun')) html += '<p><i>Le bot venait de se tromper : c\'était le moment de le punir.</i></p>';

/* ---------- statistiques d'une partie ---------- */
function accOf(loss) { return Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * loss) - 3.1669)); }
function reviewStats(r) {
  var out = { w: { n: 0, acc: 0, c: {} }, b: { n: 0, acc: 0, c: {} } }, ph = { w: [[], [], []], b: [[], [], []] };
  r.moves.forEach(function (m, i) {
