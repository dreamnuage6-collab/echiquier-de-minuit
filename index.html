    var o = out[m.color]; o.n++; o.acc += accOf(inf.loss); o.c[inf.cls] = (o.c[inf.cls] || 0) + 1;
    ph[m.color][i < 16 ? 0 : i < 50 ? 1 : 2].push(accOf(inf.loss));
  });
  ['w', 'b'].forEach(function (c) {
    out[c].acc = out[c].n ? Math.round(out[c].acc / out[c].n) : 0;
    out[c].ph = ph[c].map(function (a) { return a.length >= 3 ? Math.round(a.reduce(function (x, y) { return x + y; }, 0) / a.length) : null; });
  });

}
function reviewTips(r) {

  var hang = 0, missed = 0, early = 0, unpunished = 0, maxWp = 0;
  r.moves.forEach(function (m, i) {
    var inf = moveInfo(r, i); if (!inf) return;
    var e = evalAt(r, i + 1); if (e) { var w = wpOf(e.cp); maxWp = Math.max(maxWp, side === 'w' ? w : 100 - w); }
    if (m.color === side) {
      if (inf.cls === 'mist' || inf.cls === 'blun') {
        var rep = replyOf(r, i);
        if (rep && rep.m.captured && PVAL[rep.m.captured] >= 3) hang++;
        var bm = moveObj(r.fens[i], inf.best.uci);
        if (bm && (bm.captured || /[+#]/.test(bm.san)) && !m.captured) missed++;
        if (i < 16) early++;

    } else if ((inf.cls === 'mist' || inf.cls === 'blun') && i + 1 < r.moves.length) {
      var nm = moveInfo(r, i + 1); if (nm && nm.cls !== 'best' && nm.cls !== 'book' && nm.cls !== 'good') unpunished++;
    }
  });
  if (hang) tips.push('Tu as laissé ' + (hang > 1 ? hang + ' fois' : 'une fois') + ' une pièce en prise. Avant chaque coup, demande-toi : « que peut prendre mon adversaire après ça ? »');
  if (missed) tips.push('Tu as raté ' + (missed > 1 ? missed + ' occasions' : 'une occasion') + ' de gagner du matériel ou de donner un échec fort. Regarde d\'abord les prises et les échecs.');
  if (early) tips.push('L\'ouverture a dérapé tôt. Relance le mode Répertoire pour fixer les premiers coups.');
  if (unpunished) tips.push('Le bot t\'a offert ' + (unpunished > 1 ? unpunished + ' cadeaux' : 'un cadeau') + ' que tu n\'as pas saisi' + (unpunished > 1 ? 's' : '') + '. Quand l\'adversaire joue un coup étrange, cherche ce qu\'il laisse sans défense.');
  if (r.spec.result && r.spec.result !== 'win' && maxWp >= 85) tips.push('Tu avais une position gagnante à un moment, puis la partie a tourné. Quand tu es en avance : échange les pièces, protège ton roi, ne précipite rien.');

}

/* ---------- lancement de l'analyse ---------- */
function startReview(spec) {

  var G = new Chess(); if (spec.startFen) G.load(spec.startFen);
  r.fens.push(G.fen());
  for (var i = 0; i < spec.sans.length; i++) {
    var m = G.move(spec.sans[i]); if (!m) break;
    r.moves.push(m); r.sans.push(m.san); r.fens.push(G.fen());
  }
  if (r.moves.length < 1) { go('home'); toast('Partie vide : rien à analyser.'); return; }
  r.board = layoutPlay('Bilan de partie', spec.title || 'Revue de la partie', function () { if (spec.back) spec.back(); else go('home'); });
  r.board.orient = spec.side === 'b' ? 'b' : 'w';

  r.board.onMove = function () {};

  reviewDrawLists(r);

  bubble('Analyse', '', thinking('Corvin examine chaque coup') + '<div class="prog"><i id="rv-bar" style="width:0%"></i></div><p class="muted" id="rv-txt">0 / ' + (r.sans.length + 1) + ' positions</p>');
  actions([]);
  reviewKeys();
  var total = r.sans.length + 1, last = 0;
  runAnalysis(r, function (done) {

    if (bar) bar.style.width = Math.round(done / total * 100) + '%';
    if (t) t.textContent = done + ' / ' + total + ' positions';
    if (done - last >= 4 || done === total) { last = done; reviewDrawLists(r); if (r.done) return; }
  }).then(function () {

}
function runAnalysis(r, onStep) {

      reviewSearch(fen, idx < n, r.spec.deep).then(function (s) {
        if (r.dead) return;
        r.an[idx] = { over: false, top: (s && s.top && s.top.length) ? s.top : (s && s.uci ? [{ uci: s.uci, score: s.score }] : []) };

function reviewKeys() {
  if (window.__rvKeys) return; window.__rvKeys = true;
  window.addEventListener('keydown', function (e) {

    else if (e.key === 'ArrowLeft') { r.alt = false; reviewShow(r, r.k - 1); e.preventDefault(); }
    else if (e.key === 'Home') { r.alt = false; reviewShow(r, 0); }
    else if (e.key === 'End') { r.alt = false; reviewShow(r, r.sans.length); }

/* ---------- courbe d'avantage et liste de coups ---------- */
function reviewDrawLists(r) {
  var n = r.sans.length, W = 300, H = 66, pts = [], lastWp = 50, k;
  for (k = 0; k <= n; k++) {
    var e = evalAt(r, k), wp = e ? (e.res === '1-0' ? 100 : e.res === '0-1' ? 0 : e.res ? 50 : wpOf(e.cp)) : null;
    if (wp === null) wp = (k === 0 ? 50 : lastWp);
    lastWp = wp; pts.push([n ? k / n * W : 0, H - wp / 100 * H]);
  }
  var d = pts.map(function (p, j) { return (j ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var dots = '';
  r.moves.forEach(function (m, i) {
    var inf = moveInfo(r, i); if (!inf || (inf.cls !== 'mist' && inf.cls !== 'blun')) return;
    dots += '<circle cx="' + pts[i + 1][0].toFixed(1) + '" cy="' + pts[i + 1][1].toFixed(1) + '" r="3.2" fill="' + CLS[inf.cls].col + '" stroke="#0b0910" stroke-width="1"/>';
  });
  var g = $('#evgraph');
  if (g) {
    g.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Courbe d\'avantage : cliquer pour aller à un coup"><rect width="' + W + '" height="' + H + '" fill="#2a2338"/>' +
      '<path d="' + d + ' L' + W + ' ' + H + ' L0 ' + H + 'Z" fill="#ece4d0" opacity=".9"/><line x1="0" y1="' + H / 2 + '" x2="' + W + '" y2="' + H / 2 + '" stroke="#e8a33d" stroke-dasharray="3 3" stroke-width=".8"/>' +
      '<path d="' + d + '" fill="none" stroke="#0b0910" stroke-width="1.2"/>' + dots + '<line id="evcur" x1="0" y1="0" x2="0" y2="' + H + '" stroke="#9a78cf" stroke-width="2"/></svg>';
    var svg = g.firstChild;
    svg.onclick = function (ev) { var b = svg.getBoundingClientRect(); r.alt = false; reviewShow(r, Math.round((ev.clientX - b.left) / b.width * n)); };
    var cur = $('#evcur'); if (cur) { var x = n ? r.k / n * W : 0; cur.setAttribute('x1', x); cur.setAttribute('x2', x); }
  }

      var inf = moveInfo(r, i), c = inf ? inf.cls : '';

    };

    ml.innerHTML = h;
    ml.querySelectorAll('.mvc').forEach(function (b) { b.onclick = function () { r.alt = false; reviewShow(r, +b.dataset.ply + 1); }; });
    var cb = ml.querySelector('.cur'); if (cb && cb.scrollIntoView) { try { ml.scrollTop = cb.offsetTop - ml.clientHeight / 2; } catch (e) {} }
  }
}

/* ---------- affichage d'une position ---------- */
function reviewShow(r, k) {
  if (r.dead) return;
  r.mode = 'view';
  k = Math.max(0, Math.min(r.sans.length, k)); r.k = k;
  var B = r.board, mv = k > 0 ? r.moves[k - 1] : null;
  var com = k > 0 ? reviewComment(r, k - 1) : null;
  var showAlt = r.alt && com && com.altArrows.length;
  var fen = showAlt ? r.fens[k - 1] : r.fens[k], g = new Chess(fen);
  B.mentor = showAlt ? com.altArrows : (com ? com.arrows : []);
  var e = evalAt(r, showAlt ? k - 1 : k); B.evalData = e ? (e.res ? { result: e.res, mate: null } : { cp: e.cp, mate: e.mate }) : null;
  B.setSide(null);
  B.render(fen, { last: showAlt ? (k > 1 ? [r.moves[k - 2].from, r.moves[k - 2].to] : null) : (mv ? [mv.from, mv.to] : null), check: checkSq(g) });
  B.drawExtras();
  if (!k) {
    bubble('Départ', '', '<p>Voici la position de départ. Avance coup par coup avec <b>▶</b> ou les flèches du clavier, ou clique sur un coup de la liste.</p>' + (r.done ? '' : '<p class="muted">L\'analyse se poursuit en arrière-plan.</p>'));
  } else {
    bubble(com.tag, com.cls, com.html + (showAlt ? '<p class="muted">Flèche orange : ton coup. Flèche verte : le meilleur coup.</p>' : ''));
  }
  var list = [];
  list.push({ label: '⏮', small: true, onClick: function () { r.alt = false; reviewShow(r, 0); } });
  list.push({ label: '◀', small: true, onClick: function () { r.alt = false; reviewShow(r, r.k - 1); } });
  list.push({ label: '▶', small: true, primary: true, onClick: function () { r.alt = false; reviewShow(r, r.k + 1); } });
  list.push({ label: 'Erreur suivante', small: true, onClick: function () { reviewNextMistake(r); } });
  if (com && com.altArrows.length) list.push({ label: showAlt ? 'Voir après le coup' : 'Voir le meilleur coup', small: true, onClick: function () { r.alt = !r.alt; reviewShow(r, r.k); } });
  if (com && com.bad) list.push({ label: 'Corriger cette erreur', small: true, primary: true, onClick: function () { reviewTry(r, k - 1); } });
  if (r.done) list.push({ label: 'Bilan', small: true, onClick: function () { reviewSummary(r); } });
  actions(list);
  var cur = $('#evcur'), n = r.sans.length; if (cur) { var x = n ? k / n * 300 : 0; cur.setAttribute('x1', x); cur.setAttribute('x2', x); }
  var ml = $('#mvlist'); if (ml) { ml.querySelectorAll('.mvc').forEach(function (b) { b.classList.toggle('cur', +b.dataset.ply === k - 1); }); var cb = ml.querySelector('.cur'); if (cb) { try { ml.scrollTop = Math.max(0, cb.offsetTop - ml.clientHeight / 2); } catch (e2) {} } }
}
function reviewNextMistake(r) {
  var n = r.sans.length, start = r.k;
  for (var step = 1; step <= n; step++) {
    var i = (start - 1 + step + n) % n; // coup suivant (indice), avec rebouclage

    var inf = moveInfo(r, i);
    if (inf && (inf.cls === 'mist' || inf.cls === 'blun') && whoOf(r, i) !== 'opp') { r.alt = false; return reviewShow(r, i + 1); }
  }
  toast(r.done ? 'Aucune erreur à signaler : bravo !' : 'Pas encore d\'erreur repérée, l\'analyse continue.');
}

/* ---------- corriger une erreur ---------- */
function reviewTry(r, i) {
  var inf = moveInfo(r, i), a = r.an[i]; if (!inf || !a) return;
  r.mode = 'try';
  var fen = r.fens[i], T = new Chess(fen), B = r.board, tries = 0, solved = false;
  B.mentor = []; B.evalData = null; B.lockEval(true);
  B.render(fen, { last: i > 0 ? [r.moves[i - 1].from, r.moves[i - 1].to] : null, check: checkSq(T) });
  B.movesFn = function (from) { return T.moves({ square: from, verbose: true }).map(function (m) { return { to: m.to, promo: !!m.promotion }; }); };
  var turn = T.turn();
  bubble('À toi de corriger', '', '<p>Tu as joué <b>' + fr(r.sans[i]) + '</b> ici, et c\'était une ' + CLS[inf.cls].label.toLowerCase() + '. Retrouve un meilleur coup pour les ' + (turn === 'w' ? 'Blancs' : 'Noirs') + '.</p>');
  B.setSide(turn);
  var back = function () { B.lockEval(false); B.movesFn = function () { return []; }; B.setSide(null); r.alt = false; reviewShow(r, i + 1); };
  actions([{ label: 'Indice', small: true, onClick: function () { B.hintSq = inf.best.uci.slice(0, 2); B.render(); bubble('Indice', '', '<p>Regarde la pièce de la case <b>' + inf.best.uci.slice(0, 2) + '</b>.</p>'); } },
    { label: 'Voir la solution', small: true, onClick: function () { B.mentor = ['g:' + inf.best.uci.slice(0, 4)]; B.hintSq = null; B.render(); bubble('Solution', '', '<p>Le meilleur coup était <b>' + fr(inf.bestSan) + '</b>.</p>'); } },
    { label: 'Retour à l\'analyse', small: true, onClick: back }]);
  B.onMove = function (from, to, promo) {
    if (solved || r.mode !== 'try') return;
    var t2 = new Chess(fen), m = t2.move({ from: from, to: to, promotion: promo || 'q' }); if (!m) return;
    Sound.forMove(t2, m); B.hintSq = null; B.setSide(null);
    B.render(t2.fen(), { last: [m.from, m.to], check: checkSq(t2) });
    var uci = m.from + m.to + (m.promotion || '');
    var judge = function (sc) {
      if (r.dead || r.mode !== 'try') return;
      var ok = uci === inf.best.uci || (sc !== null && wpOf(inf.best.score) - wpOf(sc) < 4);
      if (ok) {
        solved = true; B.flash('good');
        bubble('Bravo', 'good', '<p><b>' + fr(m.san) + '</b> est un bon coup ici. ' + (uci === inf.best.uci ? 'C\'est même le meilleur.' : 'Le moteur préférait <b>' + fr(inf.bestSan) + '</b>, mais celui-ci tient très bien.') + '</p>');
        actions([{ label: 'Retour à l\'analyse', primary: true, small: true, onClick: back }]);
      } else {
        tries++; B.flash('bad');
        bubble('Pas encore', 'bad', '<p><b>' + fr(m.san) + '</b> n\'est pas le bon coup. Réessaie' + (tries >= 2 ? ' ou demande un indice.' : '.') + '</p>');
        setTimeout(function () { if (r.dead || r.mode !== 'try') return; B.render(fen, { last: i > 0 ? [r.moves[i - 1].from, r.moves[i - 1].to] : null, check: checkSq(T) }); B.setSide(turn); }, 1100);
      }
    };
    if (t2.game_over()) return judge(t2.in_checkmate() ? Engine.MATE : 0);
    callEngine('search', { fen: t2.fen(), depth: 3, nodes: 120000 }).then(function (s) { judge(s && s.score !== undefined ? -s.score : null); });
  };
}

/* ---------- fin d'analyse : enregistrement et bilan ---------- */
function reviewFinalize(r) {
  var spec = r.spec, st = reviewStats(r); r.stats = st;
  var side = spec.side && spec.side !== 'both' ? spec.side : null;
  var added = 0;
  if (side) {
    r.moves.forEach(function (m, i) {
      if (m.color !== side) return;
      var inf = moveInfo(r, i); if (!inf || (inf.cls !== 'mist' && inf.cls !== 'blun')) return;
      var answers = inf.alts.map(function (x) { return sanOf(r.fens[i], x.uci); }).filter(Boolean);

  html += '</div>';

  if (!games.length) html += '<p class="muted">Aucune partie enregistrée. Après une partie contre le bot, ouvre « Bilan de la partie » : elle apparaîtra ici.</p>';
  else html += '<div class="glist">' + games.slice(0, 15).map(function (g, i) {
    var dt = new Date(g.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
    return '<div class="grow"><span>' + dt + '</span><span>' + (g.side === 'w' ? 'Blancs' : 'Noirs') + (g.src === 'chess.com' ? ' · chess.com' : g.lvl ? ' · ' + g.lvl : '') + '</span><span class="res ' + g.res + '">' + ({ win: 'Victoire', lose: 'Défaite', draw: 'Nulle' }[g.res] || '—') + '</span><span>' + (typeof g.acc === 'number' ? g.acc + ' %' : '—') + '</span><button class="btn small" data-g="' + i + '">Revoir</button></div>';
  }).join('') + '</div>';
  html += '</section>';
  app.innerHTML = html;
  $('#back').onclick = function () { go('home'); };
  wireSound();
  var sr = $('#st-srs'); if (sr) sr.onclick = function () { startSrs(true); };
  $('#st-rep').onclick = openRepDialog;
  app.querySelectorAll('[data-g]').forEach(function (b) {
    b.onclick = function () {
      var g = progress.games[+b.dataset.g];
      startReview({ sans: g.sans.split(' '), side: g.side, result: g.res, lvl: g.lvl, title: g.title || 'Partie du ' + new Date(g.date).toLocaleDateString('fr-FR'), rec: g, oppName: g.src === 'chess.com' ? '' : BOT, back: renderStats });
    };
  });
}

/* =================== import de parties (chess.com / PGN) =================== */
var CC_KEY = 'echiquier-minuit-cc';
function openImport() {
  var m = document.createElement('div'); m.className = 'modal';
  var saved = ''; try { saved = localStorage.getItem(CC_KEY) || ''; } catch (e) {}
  m.innerHTML = '<div class="card" role="dialog" aria-label="Importer des parties"><h3>Importer des parties</h3>' +
    '<p class="muted">Analyse tes vraies parties : le bilan coup par coup repère tes erreurs et les transforme en exercices.</p>' +
    '<div class="eyebrow">Pseudo chess.com</div><div class="opt-row"><input id="cc-user" type="text" value="' + saved.replace(/"/g, '') + '" placeholder="ton pseudo" autocomplete="off" class="field"><button class="btn primary" id="cc-go">Récupérer</button></div>' +
    '<div id="cc-out" class="muted"></div>' +
    '<div class="eyebrow">Ou colle un PGN (chess.com, Lichess…)</div><textarea id="pgn-in" rows="4" class="field" style="width:100%" placeholder="1. e4 e5 2. Nf3 …"></textarea>' +
    '<div class="opt-row"><button class="btn" id="pgn-go">Analyser ce PGN</button><button class="btn ghost" id="cc-close">Fermer</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function (e) { if (e.target === m || e.target.id === 'cc-close') m.remove(); });
  var out = m.querySelector('#cc-out');
  m.querySelector('#pgn-go').onclick = function () {
    var G = new Chess(), txt = m.querySelector('#pgn-in').value.trim();
    if (!txt || !G.load_pgn(txt, { sloppy: true })) { out.textContent = 'PGN illisible : vérifie que tu as copié toute la partie.'; return; }
    var hd = G.header(), sans = G.history();
    if (sans.length < 2) { out.textContent = 'Partie trop courte.'; return; }
    m.remove();
    startReview({ sans: sans, side: 'both', title: (hd.White || 'Blancs') + ' – ' + (hd.Black || 'Noirs'), noSave: true, back: function () { go('home'); } });
  };
  m.querySelector('#cc-go').onclick = function () {
    var u = m.querySelector('#cc-user').value.trim().toLowerCase(); if (!u) { out.textContent = 'Entre ton pseudo.'; return; }
    try { localStorage.setItem(CC_KEY, u); } catch (e) {}
    out.textContent = 'Recherche des parties…';
    fetch('https://api.chess.com/pub/player/' + encodeURIComponent(u) + '/games/archives').then(function (x) { if (!x.ok) throw new Error('404'); return x.json(); })
      .then(function (j) {
        var arch = (j.archives || []).slice(-2);
        if (!arch.length) throw new Error('vide');
        return Promise.all(arch.map(function (url) { return fetch(url).then(function (x) { return x.json(); }); }));
      }).then(function (list) {
        var games = [];
        list.forEach(function (x) { (x.games || []).forEach(function (g) { if (g.rules === 'chess' && g.pgn) games.push(g); }); });
        games.sort(function (a, b) { return b.end_time - a.end_time; });
        games = games.slice(0, 15);
        if (!games.length) { out.textContent = 'Aucune partie récente trouvée.'; return; }
        out.innerHTML = '<div class="glist">' + games.map(function (g, i) {
          var white = g.white.username.toLowerCase() === u, me = white ? g.white : g.black, opp = white ? g.black : g.white;
          var res = me.result === 'win' ? 'win' : ['agreed', 'repetition', 'stalemate', 'insufficient', '50move', 'timevsinsufficient'].indexOf(me.result) >= 0 ? 'draw' : 'lose';
          return '<div class="grow"><span>' + new Date(g.end_time * 1000).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + '</span><span>' + (white ? 'Blancs' : 'Noirs') + ' vs ' + opp.username + '</span><span class="res ' + res + '">' + ({ win: 'Victoire', lose: 'Défaite', draw: 'Nulle' }[res]) + '</span><button class="btn small" data-i="' + i + '">Analyser</button></div>';
        }).join('') + '</div>';
        out.querySelectorAll('[data-i]').forEach(function (b) {
          b.onclick = function () {
            var g = games[+b.dataset.i], white = g.white.username.toLowerCase() === u, me = white ? g.white : g.black, opp = white ? g.black : g.white;
            var res = me.result === 'win' ? 'win' : ['agreed', 'repetition', 'stalemate', 'insufficient', '50move', 'timevsinsufficient'].indexOf(me.result) >= 0 ? 'draw' : 'lose';
            var G = new Chess(); if (!G.load_pgn(g.pgn, { sloppy: true })) { out.textContent = 'Cette partie ne peut pas être lue.'; return; }
            m.remove();
            startReview({ sans: G.history(), side: white ? 'w' : 'b', result: res, id: g.end_time * 1000, src: 'chess.com', oppName: opp.username, title: 'vs ' + opp.username, back: function () { go('home'); } });
          };
        });
      }).catch(function () {
        out.innerHTML = 'Impossible de joindre chess.com (pseudo introuvable ou réseau bloqué). Cette fonction marche sur la version en ligne : tu peux aussi coller un PGN ci-dessous.';
      });
  };
}

    '<p class="muted">' + (c.all ? c.all + ' position' + (c.all > 1 ? 's' : '') + ' dans ton carnet · ' + c.mastered + ' bien maîtrisée' + (c.mastered > 1 ? 's' : '') : 'Tes erreurs en leçon, en partie et dans le répertoire arrivent ici automatiquement.') + '</p></div>' +
    '<div class="dactions"><button class="btn primary" id="srs-go"' + (c.all ? '' : ' disabled') + '>' + (c.due ? 'Réviser' : 'Réviser quand même') + '</button></div></div>';

window.__echiquier = { get R() { return R; }, startReview: startReview, startSrs: startSrs, startRepertoire: startRepertoire, renderStats: renderStats, srsAdd: srsAdd, openImport: openImport, progress: progress, go: go, startFree: startFree, startLevel: startLevel, CHAPTERS: CHAPTERS };
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
